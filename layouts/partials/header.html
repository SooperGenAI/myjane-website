<header class="border-b border-navy-700/10">
  <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-3">
    <a href="/">
      <img src="/logo.png" alt="{{ hugo.Data.site.name | default site.Title }} logo" class="h-10 w-auto">
    </a>
    <nav>
      <ul class="flex items-center gap-6">
        {{ range hugo.Data.nav }}
          <li>
            {{ if .cta }}
              <a href="{{ .url }}" class="btn-primary">{{ .name }}</a>
            {{ else }}
              <a href="{{ .url }}" class="text-navy-700 hover:text-teal-500">{{ .name }}</a>
            {{ end }}
          </li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
