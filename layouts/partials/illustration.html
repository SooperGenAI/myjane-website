{{ $file := .file }}
{{ $alt := .alt }}
{{ $class := .class | default "mx-auto w-full max-w-md" }}
{{ if os.FileExists (printf "static/uploads/illustrations/%s" $file) }}
  <img src="/uploads/illustrations/{{ $file }}" alt="{{ $alt }}" loading="lazy" class="{{ $class }}">
{{ else }}
  <div class="{{ $class }} flex aspect-[4/3] flex-col items-center justify-center gap-4 rounded-2xl border-2 border-dashed border-teal-500 bg-teal-500/10 p-6 text-center">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-12 w-12 text-teal-500">
      <rect x="3" y="3" width="18" height="18" rx="2" />
      <circle cx="8.5" cy="8.5" r="1.5" />
      <path d="M21 15l-5-5L5 21" />
    </svg>
    <p class="text-sm font-medium text-navy-700">{{ $alt }}</p>
  </div>
{{ end }}
