<section class="mx-auto max-w-3xl px-6 py-section-y">
  <h1 class="h-display text-4xl">{{ .heading }}</h1>
  <dl class="mt-10 divide-y divide-navy-700/10">
    {{ range .items }}
      <div class="py-6">
        <dt class="font-display text-lg font-semibold text-navy-700">{{ .question }}</dt>
        <dd class="mt-2 text-navy-700/70">{{ .answer }}</dd>
      </div>
    {{ end }}
  </dl>
</section>
