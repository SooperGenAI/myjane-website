<div class="card">
  <h3 class="h-display text-2xl">{{ .name }}</h3>
  <p class="mt-2">
    <span class="h-display text-3xl">{{ .price }}</span>
    <span class="text-sm text-navy-700/60">{{ .price_annual }}</span>
  </p>
  <p class="mt-3 text-navy-700/70">{{ .description }}</p>
  {{ with .cta }}<a href="{{ .url }}" class="btn-primary mt-6 inline-flex">{{ .label }}</a>{{ end }}
  <ul class="mt-8 space-y-5">
    {{ range .features }}
      <li class="flex items-start gap-4">
        <span class="inline-flex h-8 w-8 flex-none items-center justify-center rounded-full bg-teal-500 font-display text-sm font-semibold text-white">{{ .number }}</span>
        <span>
          <span class="block font-semibold text-navy-700">{{ .title }}</span>
          <span class="block text-sm text-navy-700/70">{{ .description }}</span>
        </span>
      </li>
    {{ end }}
  </ul>
</div>
